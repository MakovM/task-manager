{% extends "base.html" %}

{% block content %}
  <div class="header-block">
    <h3>Tag List</h3>
  </div>
  <div class="tasks-container">
    {% if tag_list %}
        {% for tag in tag_list %}
          <div class="tag-card">
              <h4><strong>{{tag.name}}</strong></h4>
          </div>
        {% endfor %}
    {% else %}
      <p class="empty-msg">There are no Tags</p>
    {% endif %}
  </div>
{% endblock %}
