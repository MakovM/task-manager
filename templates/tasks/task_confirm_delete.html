{% extends "base.html" %}

{% block title %}
  <title>Delete Task</title>
{% endblock %}

{% block content %}
  <h1>Delete Task</h1>
  <p>Are you sure you want to delete the task: "{{ task.name }}"?</p>
  <form action="" method="post">
  {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{% url 'tasks:task-detail' pk=task.id %}" class="btn btn-light">Cancel</a>
  </form>
{% endblock %}
