{% extends "base.html" %}

{% block title %}
  <title>Delete Tag</title>
{% endblock %}

{% block content %}
  <h1>Delete Tag</h1>
  <p>Are you sure you want to delete the tag: "{{ tag.name }}"?</p>
  <form action="" method="post">
  {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{% url 'tasks:tag-list' %}" class="btn btn-light">Cancel</a>
  </form>
{% endblock %}
