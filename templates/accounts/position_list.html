{% extends "base.html" %}

{% block content %}
  <div class="header-block">
    <h3>Position List</h3>
  </div>
  <div class="tasks-container">
    {% if position_list %}
        {% for position in position_list %}
          <div class="position-card">
              <h4><strong>{{ position.name }}</strong></h4>
          </div>
        {% endfor %}
    {% else %}
      <p class="empty-msg">There are no Positions</p>
    {% endif %}
  </div>
{% endblock %}
