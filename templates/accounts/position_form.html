{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="create-update-form">
  <h1>{{ object|yesno:"Update,Create" }} Position</h1>
    <form action="" method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <input type="submit" class="btn btn-dark" value="Submit">
      <a href="{% url 'accounts:position-list' %}" class="btn btn-light">Cancel</a>
    </form>
  </div>
{% endblock %}
