{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}
  <title>Password change</title>
{% endblock %}

{% block content %}
<div class="create-update-form">
  <h1>Change Password</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-dark">Save</button>
    <a href="{% url 'accounts:worker-detail' pk=user.id %}" class="btn btn-light">Cancel</a>
  </form>
</div>
{% endblock %}
