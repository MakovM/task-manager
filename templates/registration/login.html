{% extends "base_auth.html" %}
{% load crispy_forms_filters %}

{% block title %}
  <title>Login</title>
{% endblock %}

{% block content %}
  <div class="auth-content">
    <h1>Login</h1>
    {% if form.errors %}
      <p style="color: red">Invalid credentials</p>
    {% endif %}
    <form action="" method="post">
      {% csrf_token %}
      {{ form|crispy }}
        <input type="submit" value="Login" class="login-btn btn btn-dark">
        <a href="{% url 'accounts:sign-up' %}" class="register-now-btn">Register now</a>
    </form>
  </div>
{% endblock %}
